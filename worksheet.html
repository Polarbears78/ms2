<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS2 과학 활동지 생성기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans KR', sans-serif; background: #f5f0eb; color: #333; }

  .header { background: linear-gradient(135deg, #2c3e50, #3498db); color: white; padding: 20px; text-align: center; }
  .header h1 { font-size: 1.5em; margin-bottom: 5px; }
  .header p { font-size: 0.9em; opacity: 0.85; }

  .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }

  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .card h2 { font-size: 1.1em; color: #2c3e50; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #f0e6d8; }

  .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { padding: 10px 18px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 0.9em; transition: all 0.2s; }
  .btn:hover { border-color: #3498db; color: #3498db; }
  .btn.active { background: #3498db; color: white; border-color: #3498db; }

  .option-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .option-row label { font-weight: bold; min-width: 60px; }
  select { padding: 8px 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 0.9em; background: white; }

  #worksheet { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-top: 20px; display: none; }

  .ws-header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
  .ws-header h2 { font-size: 1.3em; }
  .ws-info { display: flex; justify-content: space-between; font-size: 0.9em; color: #666; margin-top: 8px; }

  .question { margin-bottom: 20px; padding: 12px; border-left: 3px solid #3498db; background: #f8f9fa; border-radius: 0 8px 8px 0; }
  .question .q-num { font-weight: bold; color: #3498db; font-size: 1.1em; }
  .question .q-text { margin: 8px 0; line-height: 1.6; }
  .answer-line { border-bottom: 1px dashed #ccc; height: 30px; margin: 10px 0; }

  .teacher-note { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 10px; margin-top: 8px; font-size: 0.85em; display: none; }
  .teacher-note.show { display: block; }

  .actions { text-align: center; margin: 20px 0; display: none; }
  .actions.show { display: block; }
  .btn-generate { padding: 12px 30px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 1em; cursor: pointer; }
  .btn-generate:hover { background: #219a52; }
  .btn-print { padding: 12px 30px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 1em; cursor: pointer; margin-left: 10px; }

  .toggle-switch { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .toggle-switch span { font-size: 0.85em; }
  .toggle { position: relative; width: 44px; height: 24px; background: #ccc; border-radius: 12px; cursor: pointer; transition: 0.3s; }
  .toggle.on { background: #3498db; }
  .toggle::after { content: ''; position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: 0.3s; }
  .toggle.on::after { left: 22px; }

  /* ── 응답 기록 · 채점표 ── */
  .rec-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .rec-bar input { padding: 8px 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 0.9em; width: 110px; }
  .save-chip { font-size: 0.78em; font-weight: bold; color: #27ae60; background: #eaf7f0; border-radius: 99px; padding: 5px 12px; }
  .save-chip.dirty { color: #7f8c8d; background: #eee; }

  .ws-meta { background: #f8f9fa; border: 1px solid #e3e8ec; border-radius: 8px; padding: 10px 12px; font-size: 0.85em; color: #555; line-height: 1.75; margin-bottom: 16px; }
  .ws-meta b { color: #2c3e50; }
  .ws-stu { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.88em; color: #444; margin-top: 6px; }

  .ans-area { width: 100%; border: 1px solid #cfd8dd; border-radius: 6px; padding: 8px 10px; font-family: inherit; font-size: 0.95em; line-height: 1.6; margin-top: 6px; resize: vertical; background: #fffdf8; }
  .ans-line { width: 100%; border: none; border-bottom: 1.5px dashed #bbb; padding: 6px 2px; font-family: inherit; font-size: 0.95em; background: transparent; }
  .ans-area:focus, .ans-line:focus { outline: 2px solid #3498db; outline-offset: 1px; }

  .misconc { background: #fdecea; border-left: 3px solid #e74c3c; border-radius: 0 6px 6px 0; padding: 8px 10px; margin-top: 8px; font-size: 0.84em; display: none; }
  .misconc.show { display: block; }

  .rubric { width: 100%; border-collapse: collapse; font-size: 0.8em; margin-top: 10px; }
  .rubric th, .rubric td { border: 1px solid #c8d0d6; padding: 6px 7px; vertical-align: top; text-align: left; }
  .rubric th { background: #eef3f7; color: #2c3e50; }
  .rubric td.el { background: #fafbfc; font-weight: bold; width: 16%; }
  .rubric th.std, .rubric td.std { width: 11%; text-align: center; font-size: 0.92em; color: #2c3e50; white-space: nowrap; }
  .rubric td.mark { width: 8%; text-align: center; }

  .grade-box { border: 2px solid #2c3e50; border-radius: 8px; padding: 14px; margin-top: 18px; }
  .grade-box h3 { font-size: 1em; color: #2c3e50; margin-bottom: 6px; }
  .grade-box p.sub { font-size: 0.82em; color: #777; margin-bottom: 6px; }
  .obs-note { display: block; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; min-height: 76px; padding: 8px; font-size: 0.85em; line-height: 1.6; font-family: inherit; background: #fff; resize: vertical; }
  .caution { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 10px 12px; font-size: 0.8em; line-height: 1.7; margin-top: 12px; }

  @media print {
    .header, .container > .card, .actions { display: none !important; }
    #worksheet { box-shadow: none; padding: 10px; }
    body { background: white; }
    .ans-area, .ans-line, .obs-note { border-color: #999; background: transparent; }
    .question, .grade-box, .rubric tr { break-inside: avoid; page-break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📝 MS2 과학 활동지 생성기</h1>
  <p>중학교 2학년 과학 | Polarbears78/ms2</p>
</div>

<div class="container">
  <div class="card">
    <h2>📚 단원 선택</h2>
    <div class="btn-group" id="unitBtns"></div>
  </div>

  <div class="card">
    <h2>📋 활동지 · 평가 종류</h2>
    <div class="btn-group" id="typeBtns"></div>
    <div class="option-row">
      <label>문항 수:</label>
      <select id="qCount">
        <option value="5">5문항</option>
        <option value="10" selected>10문항</option>
        <option value="15">15문항</option>
        <option value="99">전체</option>
      </select>
    </div>
    <div class="toggle-switch">
      <span>교사용 (정답 · 채점표 표시):</span>
      <div class="toggle" id="teacherToggle" onclick="toggleTeacher()"></div>
      <span id="teacherLabel">학생용</span>
    </div>
    <div class="toggle-switch">
      <span>응답 기록 모드 (이 기기에 자동 저장):</span>
      <div class="toggle" id="recordToggle" onclick="toggleRecord()"></div>
      <span id="recordLabel">꺼짐</span>
    </div>
    <div class="rec-bar" id="recBar" style="display:none">
      <input id="stuClass" placeholder="학급 (예: 2-3)">
      <input id="stuNo" placeholder="번호">
      <input id="stuName" placeholder="이름">
      <span class="save-chip dirty" id="saveChip">저장 대기</span>
    </div>
  </div>

  <div class="actions show">
    <button class="btn-generate" onclick="generateWorksheet()">📝 활동지 생성</button>
    <button class="btn-print" onclick="window.print()">🖨️ 인쇄 / PDF</button>
  </div>

  <div class="card" id="recTools" style="display:none">
    <h2>🗂️ 평가기록</h2>
    <div class="btn-group">
      <button class="btn" onclick="copySummary()">📋 응답 요약 복사</button>
      <button class="btn" onclick="downloadCSV()">⬇️ 기록 CSV 내려받기</button>
      <button class="btn" onclick="clearRecord()">🗑️ 이 활동지 기록 지우기</button>
    </div>
    <p style="font-size:0.8em; color:#777; margin-top:10px; line-height:1.6;">
      ※ 응답은 외부로 전송되지 않고 이 브라우저(기기)에만 저장됩니다. 기기·브라우저를 바꾸거나 방문 기록을 지우면 기록이 남지 않습니다.<br>
      ※ 제출·보관이 필요한 경우 <b>CSV 내려받기</b> 또는 <b>인쇄/PDF</b>로 산출물을 확보하십시오.
    </p>
  </div>

  <div id="worksheet"></div>
</div>

        hi:'광합성과 호흡의 반응물·생성물을 모두 정확히 구분하여 관계식으로 나타낸다.',
        mid:'반응물과 생성물을 대체로 구분하나 일부 물질을 혼동하거나 관계식이 불완전하다.',
        lo:'반응물과 생성물을 구분하지 못하거나 두 과정을 뒤바꾸어 서술한다.' },
      { el:'에너지 출입 분석', std:'9과12-02',
        hi:'광합성은 빛에너지의 흡수·저장, 호흡은 에너지의 방출·사용임을 방향까지 정확히 설명한다.',
        mid:'두 과정의 에너지 출입을 언급하나 방향이나 용어 사용이 부정확하다.',
        lo:'에너지 출입을 설명하지 못한다.' },
      { el:'빛 조건에 따른 기체 출입 해석', std:'9과12-02',
        hi:'빛의 세기에 따라 광합성량과 호흡량을 비교하여 겉보기 기체 출입을 세 가지 경우로 구분해 해석한다.',
        mid:'낮과 밤의 두 경우는 설명하나, 두 양이 같아지는 경우를 설명하지 못한다.',
        lo:'겉보기 결과와 실제 과정을 구분하지 못한다(예: 낮에는 광합성만 한다고 진술).' },
      { el:'광합성산물의 저장·이용 (모형 설명)', std:'9과12-03',
        hi:'포도당 → 녹말 → 설탕의 전환과 체관을 통한 이동, 사용·저장 형태를 근거를 들어 연결하여 설명하고, 이를 모형(정보 그림)으로 표현한다.',
        mid:'전환 또는 이동 중 일부만 설명하거나 이동 통로를 혼동하며, 모형 표현이 불완전하다.',
        lo:'산물의 저장·이용 과정을 설명하지 못한다.' },
      { el:'탐구 수행 (변인 통제·안전)', std:'공통',
        hi:'조작·종속·통제 변인을 구분하여 설정하고, 안전 수칙을 지키며 관찰 결과를 근거로 결론을 도출한다.',
        mid:'변인을 일부만 구분하거나, 결과 해석에서 근거 제시가 부족하다.',
        lo:'변인을 구분하지 못하고 결과와 무관한 결론을 제시한다.' }
    ]
  }
};

/* ═══════════════ 상태 ═══════════════ */
const TYPE_LABELS = { concept: '개념 정리 활동지', inquiry: '해 보기 활동지', total: '총괄 평가', essay: '서술형 평가' };
const TYPE_ORDER = ['concept', 'inquiry', 'total', 'essay'];
const LONG_TYPES = ['inquiry', 'essay'];
const UNIT_LABELS = { '2': 'II. 물질의 구성', '3': 'III. 우리 주변의 화합물', '4': 'IV. 물질 변화와 화학 반응식', '5': 'Ⅴ. 식물과 에너지' };

let currentUnit = '5';
let currentType = 'concept';
let isTeacher = false;
let isRecord = false;
let saveTimer = null;

/* ═══════════════ 저장소 (이 기기에만 저장) ═══════════════ */
const memStore = {};
function stGet(k) { try { return localStorage.getItem(k); } catch (e) { return memStore[k] || null; } }
function stSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } }
function stDel(k) { try { localStorage.removeItem(k); } catch (e) { delete memStore[k]; } }

const STU_KEY = 'ms2-ws:student';
function fieldVal(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function currentStudent() {
  const saved = loadStudent();
  return { cls: fieldVal('stuClass') || saved.cls || '', no: fieldVal('stuNo') || saved.no || '', name: fieldVal('stuName') || saved.name || '' };
}
function recKey(unit, type) { return 'ms2-ws:' + (unit || currentUnit) + ':' + (type || currentType); }
function loadRecord() { try { return JSON.parse(stGet(recKey()) || '{}'); } catch (e) { return {}; } }
function loadStudent() { try { return JSON.parse(stGet(STU_KEY) || '{}'); } catch (e) { return {}; } }

function chip(text, dirty) {
  const el = document.getElementById('saveChip');
  el.textContent = text;
  el.className = 'save-chip' + (dirty ? ' dirty' : '');
}

function saveNow() {
  const stu = currentStudent();
  stSet(STU_KEY, JSON.stringify(stu));

  const ans = {};
  document.querySelectorAll('#worksheet [data-ans]').forEach(el => { ans[el.dataset.ans] = el.value; });
  const obs = document.querySelector('#worksheet [data-obs]');
  const rec = {
    unit: currentUnit, type: currentType, student: stu, answers: ans,
    observation: obs ? obs.value : '',
    savedAt: new Date().toLocaleString('ko-KR')
  };
  stSet(recKey(), JSON.stringify(rec));
  chip('저장됨 · ' + rec.savedAt.replace(/^.*?\s/, ''), false);
}
function queueSave() { if (!isRecord) return; chip('저장 중…', true); clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 600); }

/* ═══════════════ 버튼 조립 ═══════════════ */
function buildUnitBtns() {
  const wrap = document.getElementById('unitBtns');
  wrap.innerHTML = Object.keys(DB).map(u =>
    '<button class="btn' + (u === currentUnit ? ' active' : '') + '" data-unit="' + u + '">' + (UNIT_LABELS[u] || DB[u].title) + '</button>'
  ).join('');
  wrap.querySelectorAll('.btn').forEach(b => b.addEventListener('click', function () {
    currentUnit = this.dataset.unit;
    buildUnitBtns(); buildTypeBtns();
    document.getElementById('worksheet').style.display = 'none';
  }));
}
function buildTypeBtns() {
  const wrap = document.getElementById('typeBtns');
  const avail = TYPE_ORDER.filter(t => Array.isArray(DB[currentUnit][t]) && DB[currentUnit][t].length);
  if (avail.indexOf(currentType) === -1) currentType = avail[0];
  wrap.innerHTML = avail.map(t =>
    '<button class="btn' + (t === currentType ? ' active' : '') + '" data-type="' + t + '">' + TYPE_LABELS[t] + '</button>'
  ).join('');
  wrap.querySelectorAll('.btn').forEach(b => b.addEventListener('click', function () {
    currentType = this.dataset.type;
    buildTypeBtns();
    document.getElementById('worksheet').style.display = 'none';
  }));
}

/* ═══════════════ 토글 ═══════════════ */
function toggleTeacher() {
  isTeacher = !isTeacher;
  document.getElementById('teacherToggle').classList.toggle('on', isTeacher);
  document.getElementById('teacherLabel').textContent = isTeacher ? '교사용' : '학생용';
  if (document.getElementById('worksheet').style.display === 'block') generateWorksheet();
}
function toggleRecord() {
  isRecord = !isRecord;
  document.getElementById('recordToggle').classList.toggle('on', isRecord);
  document.getElementById('recordLabel').textContent = isRecord ? '켜짐' : '꺼짐';
  document.getElementById('recBar').style.display = isRecord ? 'flex' : 'none';
  document.getElementById('recTools').style.display = isRecord ? 'block' : 'none';
  if (document.getElementById('worksheet').style.display === 'block') generateWorksheet();
}

/* ═══════════════ 활동지 생성 ═══════════════ */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function currentItems() {
  const list = DB[currentUnit][currentType] || [];
  const n = parseInt(document.getElementById('qCount').value, 10);
  return list.slice(0, Math.min(n, list.length));
}

function generateWorksheet() {
  const unitData = DB[currentUnit];
  const selected = currentItems();
  const typeLabel = TYPE_LABELS[currentType];
  const isLong = LONG_TYPES.indexOf(currentType) !== -1;
  const perScore = isLong ? 10 : 5;
  const maxScore = selected.length * perScore;
  const meta = unitData.meta;
  const rec = isRecord ? loadRecord() : {};
  const saved = rec.answers || {};
  const stu = currentStudent();

  let html = '<div class="ws-header"><h2>' + esc(unitData.title) + ' — ' + typeLabel + '</h2>';
  html += '<div class="ws-info"><span>중학교 2학년 과학</span><span>이름: ' +
    (isRecord && stu.name ? esc(stu.name) : '______________') + '</span><span>점수: ____ / ' + maxScore + '</span></div>';
  if (isRecord) {
    html += '<div class="ws-stu"><span>학급: ' + esc(stu.cls || '____') + '</span><span>번호: ' + esc(stu.no || '__') + '</span>' +
      (rec.savedAt ? '<span>최근 저장: ' + esc(rec.savedAt) + '</span>' : '') + '</div>';
  }
  html += '</div>';

  if (meta) {
    html += '<div class="ws-meta"><b>차시</b> ' + esc(meta.lesson) + ' · <b>' + esc(meta.pages) + '</b><br>' +
      '<b>학습 목표</b> ' + esc(meta.goal) + '<br><b>준비물</b> ' + esc(meta.materials);
    if (isTeacher && meta.standards) {
      html += '<br><b>성취기준</b>' + meta.standards.map(st =>
        '<br>&nbsp;&nbsp;<b>' + esc(st.code) + '</b> ' + esc(st.text)).join('');
    }
    html += '</div>';
  }

  selected.forEach((item, idx) => {
    const key = currentType + '-' + idx;
    let q = '<div class="question"><span class="q-num">' + (idx + 1) + '.</span> ';
    q += '<span class="q-text">' + esc(item.q) + '</span>';
    if (isRecord) {
      q += isLong
        ? '<textarea class="ans-area" rows="4" data-ans="' + key + '" placeholder="답을 쓰시오">' + esc(saved[key] || '') + '</textarea>'
        : '<input class="ans-line" data-ans="' + key + '" value="' + esc(saved[key] || '') + '" placeholder="답을 쓰시오">';
    } else {
      q += '<div class="answer-line"></div>';
      if (isLong) q += '<div class="answer-line"></div><div class="answer-line"></div>';
    }
    if (isTeacher) {
      q += '<div class="teacher-note show">✅ ' + (isLong ? '모범 답안: ' : '정답: ') + esc(item.a) + '</div>';
      if (item.m) q += '<div class="misconc show">⚠ 오개념 · 지도 유의점: ' + esc(item.m) + '</div>';
    }
    q += '</div>';
    html += q;
  });

  /* ── 교사용 채점표 (평가기록) ── */
  if (isTeacher && unitData.rubric) {
    html += '<div class="grade-box"><h3>📊 교사용 채점표 (과정 중심 평가)</h3>';
    html += '<p class="sub">학습 목표 준거: ' + esc(meta ? meta.goal : '') + '</p>';
    html += '<table class="rubric"><tr><th>평가 요소</th><th class="std">성취기준</th><th>상</th><th>중</th><th>하</th><th class="mark">판정</th></tr>';
    unitData.rubric.forEach(r => {
      html += '<tr><td class="el">' + esc(r.el) + '</td><td class="std">' + esc(r.std || '') + '</td><td>' + esc(r.hi) + '</td><td>' + esc(r.mid) +
        '</td><td>' + esc(r.lo) + '</td><td class="mark">상 · 중 · 하</td></tr>';
    });
    html += '</table>';
    html += '<h3 style="margin-top:14px">🖊️ 관찰 사실 기록</h3>';
    html += '<p class="sub">관찰한 행동 · 발언 · 산출물만 사실 그대로 기록합니다. 추측, 성향 평가, 과장 표현은 쓰지 않습니다.</p>';
    if (isRecord) {
      html += '<textarea class="obs-note" data-obs="1" placeholder="예: ㉢ 시험관을 두는 까닭을 대조군 개념으로 설명함 / 이동 통로를 물관으로 답했다가 모둠 토의 후 체관으로 수정함">' + esc(rec.observation || '') + '</textarea>';
    } else {
      html += '<div class="obs-note"></div>';
    }
    html += '<div class="caution"><b>활용 시 유의</b><br>' +
      '· 본 채점표는 수업 설계 보조 자료이며, 성취 수준의 최종 판정과 학교생활기록부 기재 여부는 교사의 전문적 검토로 결정합니다.<br>' +
      '· 성취기준은 2022 개정 교육과정 [9과12-02] · [9과12-03]에 근거하며, 배점 · 반영 비율은 학교 학업성적관리규정과 평가 계획에 맞추어 조정하십시오.<br>' +
      '· 학교생활기록부 기재 시에는 관찰된 사실과 학생이 실제로 산출한 결과에 근거하여 서술합니다.</div>';
    html += '</div>';
  }

  const ws = document.getElementById('worksheet');
  ws.innerHTML = html;
  ws.style.display = 'block';

  if (isRecord) {
    stSet(STU_KEY, JSON.stringify(stu));
    ws.querySelectorAll('[data-ans], [data-obs]').forEach(el => el.addEventListener('input', queueSave));
    chip(rec.savedAt ? '저장됨 · ' + rec.savedAt : '저장 대기', !rec.savedAt);
  }
  ws.scrollIntoView({ behavior: 'smooth' });
}

/* ═══════════════ 평가기록 내보내기 ═══════════════ */
function recordRows() {
  const items = currentItems();
  const rec = loadRecord();
  const saved = rec.answers || {};
  return items.map((item, idx) => ({
    no: idx + 1,
    q: item.q,
    a: saved[currentType + '-' + idx] || '',
    model: item.a
  }));
}
function copySummary() {
  const stu = currentStudent(); const rec = loadRecord();
  const head = [DB[currentUnit].title, TYPE_LABELS[currentType],
    '학급 ' + (stu.cls || '-') + ' / 번호 ' + (stu.no || '-') + ' / 이름 ' + (stu.name || '-'),
    '저장 시각: ' + (rec.savedAt || '-')].join(' | ');
  const body = recordRows().map(r => r.no + '. ' + r.q + '\n   → ' + (r.a || '(미작성)')).join('\n');
  const obs = rec.observation ? '\n\n[관찰 사실 기록]\n' + rec.observation : '';
  const txt = head + '\n\n' + body + obs;
  navigator.clipboard.writeText(txt).then(
    () => chip('요약을 복사했습니다', false),
    () => { window.prompt('아래 내용을 복사하십시오', txt); }
  );
}
function downloadCSV() {
  const stu = currentStudent(); const rec = loadRecord();
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const lines = [['학급', '번호', '이름', '단원', '활동지', '문항번호', '문항', '학생 응답', '모범 답안', '저장 시각'].map(q).join(',')];
  recordRows().forEach(r => {
    lines.push([stu.cls || '', stu.no || '', stu.name || '', DB[currentUnit].title, TYPE_LABELS[currentType],
      r.no, r.q, r.a, r.model, rec.savedAt || ''].map(q).join(','));
  });
  if (rec.observation) lines.push(['', '', '', '', '관찰 사실 기록', '', '', rec.observation, '', rec.savedAt || ''].map(q).join(','));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ms2_' + currentUnit + '_' + currentType + '_' + (stu.name || 'record') + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function clearRecord() {
  if (!window.confirm('이 활동지(' + TYPE_LABELS[currentType] + ')의 저장된 응답을 모두 지울까요?')) return;
  stDel(recKey());
  chip('기록을 지웠습니다', true);
  if (document.getElementById('worksheet').style.display === 'block') generateWorksheet();
}

/* ═══════════════ 시작 ═══════════════ */
document.addEventListener('DOMContentLoaded', () => {
  buildUnitBtns();
  buildTypeBtns();
  const stu = loadStudent();
  document.getElementById('stuClass').value = stu.cls || '';
  document.getElementById('stuNo').value = stu.no || '';
  document.getElementById('stuName').value = stu.name || '';
  ['stuClass', 'stuNo', 'stuName'].forEach(id => document.getElementById(id).addEventListener('input', queueSave));
});
</script>
</body>
</html>
