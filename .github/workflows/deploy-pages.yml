name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/upbeat-dijkstra-ej4ddf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포가 겹치지 않도록 큐잉
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 정적 파일이 저장소 루트에 있으므로 전체를 업로드
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
